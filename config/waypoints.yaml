# KABOAT Waypoint Configuration
# Coordinates are in WGS84 (latitude, longitude)

# Default waypoint tolerance in meters
default_tolerance: 3.0

# Mission: Hopping Tour
hopping_tour:
  waypoints:
    - name: "start"
      latitude: -33.7227
      longitude: 150.6740
      tolerance: 3.0
      hold_time: 3.0  # seconds to hold position
    - name: "waypoint_1"
      latitude: -33.7225
      longitude: 150.6742
      tolerance: 3.0
      hold_time: 3.0
    - name: "waypoint_2"
      latitude: -33.7223
      longitude: 150.6738
      tolerance: 3.0
      hold_time: 3.0

# Mission: Aligned Navigation (Static obstacles)
aligned_navigation:
  waypoints:
    - name: "gate_1"
      latitude: -33.7226
      longitude: 150.6741
    - name: "gate_2"
      latitude: -33.7224
      longitude: 150.6743
  obstacles:
    - latitude: -33.7225
      longitude: 150.6742
      radius: 2.0

# Buoy colors for image sensing mission (HSV ranges)
buoy_colors:
  red:
    h_min: 0
    h_max: 10
    s_min: 100
    s_max: 255
    v_min: 100
    v_max: 255
  green:
    h_min: 40
    h_max: 80
    s_min: 100
    s_max: 255
    v_min: 100
    v_max: 255
  blue:
    h_min: 100
    h_max: 130
    s_min: 100
    s_max: 255
    v_min: 100
    v_max: 255
  yellow:
    h_min: 20
    h_max: 35
    s_min: 100
    s_max: 255
    v_min: 100
    v_max: 255
